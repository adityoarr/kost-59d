<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: #8A6B2A;
      --black: #080808;
      --dark: #0E0E0E;
      --surface: #141414;
      --text-muted: #5A5040;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 100;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative corner lines */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 1.6s;
    }
    .corner--tl { top: 32px; left: 32px; border-top: 1px solid var(--gold-dim); border-left: 1px solid var(--gold-dim); }
    .corner--tr { top: 32px; right: 32px; border-top: 1px solid var(--gold-dim); border-right: 1px solid var(--gold-dim); }
    .corner--bl { bottom: 32px; left: 32px; border-bottom: 1px solid var(--gold-dim); border-left: 1px solid var(--gold-dim); }
    .corner--br { bottom: 32px; right: 32px; border-bottom: 1px solid var(--gold-dim); border-right: 1px solid var(--gold-dim); }

    @media (max-width: 480px) {
      .corner { width: 36px; height: 36px; }
      .corner--tl { top: 20px; left: 20px; }
      .corner--tr { top: 20px; right: 20px; }
      .corner--bl { bottom: 20px; left: 20px; }
      .corner--br { bottom: 20px; right: 20px; }
    }

    /* Main layout */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 0;
    }

    /* Top label */
    .label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(9px, 1.1vw, 11px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: slideDown 0.9s ease forwards;
      animation-delay: 0.2s;
      margin-bottom: 28px;
    }

    /* Thin horizontal rule */
    .rule {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--gold-dim), transparent);
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 0.5s;
      margin-bottom: 28px;
    }

    /* Main headline */
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(52px, 10vw, 130px);
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-align: center;
      color: #fff;
      opacity: 0;
      animation: slideUp 1s ease forwards;
      animation-delay: 0.7s;
    }

    .headline em {
      font-style: italic;
      color: var(--gold-light);
    }

    /* Ornamental divider */
    .ornament {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 36px 0;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 1s;
    }

    .ornament__line {
      width: clamp(40px, 8vw, 100px);
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }

    .ornament__line--rev {
      background: linear-gradient(to left, transparent, var(--gold-dim));
    }

    .ornament__diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    /* Date & subtitle */
    .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6A5F4A;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 1.1s;
      margin-bottom: 8px;
    }

    .date {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(18px, 3.5vw, 38px);
      letter-spacing: 0.12em;
      color: var(--gold);
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 1.2s;
    }

    /* Countdown */
    .countdown-wrap {
      margin-top: 48px;
      opacity: 0;
      animation: slideUp 0.9s ease forwards;
      animation-delay: 1.4s;
    }

    .countdown {
      display: flex;
      gap: clamp(16px, 4vw, 48px);
      align-items: flex-start;
    }

    .countdown__unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .countdown__num {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 1;
      color: #fff;
      min-width: clamp(52px, 8vw, 96px);
      text-align: center;
      position: relative;
    }

    .countdown__num::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    }

    .countdown__label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(7px, 0.9vw, 9px);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .countdown__sep {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(28px, 5vw, 56px);
      color: var(--gold-dim);
      line-height: 1;
      padding-top: 4px;
      opacity: 0.5;
    }

    /* Bottom tagline */
    .tagline {
      margin-top: 52px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(13px, 1.8vw, 17px);
      letter-spacing: 0.08em;
      color: #3A3028;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 1.7s;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tablet */
    @media (max-width: 768px) {
      .wrapper { padding: 72px 20px; }
      .rule { height: 36px; }
      .ornament { margin: 28px 0; }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .wrapper { gap: 0; padding: 60px 16px; }
      .countdown { gap: 10px; }
      .countdown__sep { display: none; }
      .ornament { margin: 22px 0; }
      .countdown-wrap { margin-top: 36px; }
      .tagline { margin-top: 40px; }
    }
  </style>
</head>
<body>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <main class="wrapper">
    <p class="label">Something extraordinary awaits</p>
    <div class="rule"></div>

    <h1 class="headline">Coming<br><em>Soon</em></h1>

    <div class="ornament">
      <div class="ornament__line"></div>
      <div class="ornament__diamond"></div>
      <div class="ornament__line ornament__line--rev"></div>
    </div>

    <p class="subtitle">Estimated launch</p>
    <p class="date">April 1st, 2026</p>

    <div class="countdown-wrap">
      <div class="countdown">
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-days">00</span>
          <span class="countdown__label">Days</span>
        </div>
        <span class="countdown__sep">·</span>
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-hours">00</span>
          <span class="countdown__label">Hours</span>
        </div>
        <span class="countdown__sep">·</span>
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-mins">00</span>
          <span class="countdown__label">Minutes</span>
        </div>
        <span class="countdown__sep">·</span>
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-secs">00</span>
          <span class="countdown__label">Seconds</span>
        </div>
      </div>
    </div>

    <p class="tagline">Patience is the companion of wisdom.</p>
  </main>

  <script>
    const target = new Date('2026-04-01T00:00:00').getTime();

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById('cd-days').textContent = '00';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-mins').textContent = '00';
        document.getElementById('cd-secs').textContent = '00';
        return;
      }

      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000) / 60000);
      const secs  = Math.floor((diff % 60000) / 1000);

      document.getElementById('cd-days').textContent  = pad(days);
      document.getElementById('cd-hours').textContent = pad(hours);
      document.getElementById('cd-mins').textContent  = pad(mins);
      document.getElementById('cd-secs').textContent  = pad(secs);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
